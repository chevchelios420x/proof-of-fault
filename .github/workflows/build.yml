name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Allow unprivileged ping (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - name: Test
        run: go test ./internal/...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: scripts/build-windows.sh
      - name: Vet
        run: go vet ./... && GOOS=windows go vet ./...
      - uses: actions/upload-artifact@v4
        with:
          name: proof-of-fault
          path: |
            build/bin/proof-of-fault-v*.exe
            build/bin/proof-of-fault-v*-linux-amd64
